<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Club Membership</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>

    <style>
        body {
            background-color: #ffdeeb;
            font-family: 'Poppins', sans-serif;
            color: #70485a;
        }

        .card {
            max-width: 430px;
            margin: 40px auto;
            padding: 35px;
            background-color: white;
            border: 2px solid #f2a7c6;
            border-radius: 22px;
            box-shadow: 0 8px 25px #ebb2ca;
        }

        h1 {
            color: #d94182;
            font-size: 30px;
            font-weight: 700;
        }

        .subtitle {
            color: #a86c87;
            font-size: 14px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: #b34775;
            margin-bottom: 7px;
        }

        .form-control {
            border: 2px solid #f7bfd8;
            border-radius: 10px;
            padding: 11px;
            background-color: #fff7fa;
        }

        .form-control:focus {
            border-color: #d94182;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px #fce0eb;
        }

        .btn-pink {
            background-color: #e05390;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
        }

        .btn-pink:hover {
            background-color: #c73c77;
            color: white;
        }

        #result {
            font-size: 14px;
            text-align: center;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .heart {
            color: #d94182;
            font-size: 28px;
        }
    </style>
</head>

<body class="container py-5">

    <div class="text-center">
        <div class="heart">♡</div>
        <h1>ICT Club</h1>
        <p class="subtitle">MEMBERSHIP CHECKER</p>
    </div>

    <div class="card">
        <h5 class="text-center mb-2" style="color: #d94182;">Welcome!˚.🎀༘⋆</h5>
        <p class="subtitle text-center mb-4">
            Enter your name to check your membership.
        </p>

        <label for="first_name">First Name</label>
        <input type="text" id="first_name"
               class="form-control mb-3"
               placeholder="Enter your first name">

        <label for="last_name">Last Name</label>
        <input type="text" id="last_name"
               class="form-control mb-4"
               placeholder="Enter your last name">

        <button class="btn btn-pink w-100" py-click="check_name">
            Check Membership ♡
        </button>

        <p id="result" class="mt-4 mb-0"></p>
    </div>

    <script type="py" src="./main.py"></script>

</body>
</html>
